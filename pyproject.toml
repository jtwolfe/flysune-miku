[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cursed-tts"
version = "0.1.0"
description = "A cursed mushroom-body phoneme picker TTS toy inspired by FlyWire"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Cursed TTS Contributors"}
]
keywords = ["tts", "mushroom-body", "neural-network", "phoneme", "flywire"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "cmudict>=1.0.0",
    "g2p_en>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
plot = [
    "matplotlib>=3.7.0",
]

[project.scripts]
cursed-tts = "cursed_tts.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cursed_tts*"]
